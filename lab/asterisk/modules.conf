; Ubuntu's package loads the IMAP variant of voicemail first, which leaves VoiceMailMain
; unregistered ("No application 'VoiceMailMain'"): *97 then ended the call at once.
; Only the plain file-based voicemail is wanted.
[modules]
autoload=yes
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
