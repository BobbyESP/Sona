; Sona's lab dial plan: each case of the call matrix in docs/roadmap.md has a number.

[general]
static=yes
writeprotect=no

[lab]
; 101-199: call that extension; voicemail after 30 seconds without an answer.
exten => _1XX,1,NoOp(Call from ${CALLERID(num)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,VoiceMail(${EXTEN}@lab,u)
 same => n,Hangup()
 same => n(busy),VoiceMail(${EXTEN}@lab,b)
 same => n,Hangup()

; 600: echo test. Hear yourself after a moment: audio works both ways.
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 486: always busy. Sona should say "486 is busy".
exten => 486,1,Busy(5)

; *97: your voicemail box. Checks DTMF: the menu must answer the keys.
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@lab)
 same => n,Hangup()

; Any other number does not match, and Asterisk answers 404: "There is no extension …".

[messages]
; SIP MESSAGE between extensions (docs/messaging.md). Asterisk answers the sender 202 Accepted as
; soon as the message is here, before it is delivered: a phone that is not registered never gets
; it, and only the log says so. Only text/plain arrives, and only bodies up to 1023 bytes.
exten => _1XX,1,NoOp(Message from ${MESSAGE(from)} to ${EXTEN})
 same => n,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,NoOp(Delivery to ${EXTEN}: ${MESSAGE_SEND_STATUS})
 same => n,Hangup()

; 600: message echo. Answers each text with the same text, to see what the server relays (a body
; over the limit comes back empty).
exten => 600,1,Set(SENDER=${CUT(CUT(MESSAGE(from),@,1),:,2)})
 same => n,Set(MESSAGE(body)=Echo: ${MESSAGE(body)})
 same => n,MessageSend(pjsip:${SENDER},"Echo" <sip:600@lab>)
 same => n,Hangup()
