; Sona's lab: three extensions (101, 102, 103) over UDP and TCP.
; Copy to /etc/asterisk/ on the lab server and run `core reload` in the Asterisk console.
; Change every password before the server is reachable from anywhere but your own network.

[global]
type=global
user_agent=Sona Lab Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; What every lab phone has in common.
[lab-endpoint](!)
type=endpoint
context=lab
disallow=all
allow=g722,ulaw,alaw        ; add opus first if codec_opus is installed
direct_media=no             ; media through Asterisk: phones on campus Wi-Fi rarely reach each other
rtp_symmetric=yes           ; send RTP back where it came from (NAT)
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[lab-auth](!)
type=auth
auth_type=userpass

[lab-aor](!)
type=aor
max_contacts=2              ; the phone and the emulator
remove_existing=yes
qualify_frequency=30

; --- 101 ---
[101](lab-endpoint)
auth=101
aors=101
callerid="Lab 101" <101>

[101](lab-auth)
username=101
password=change-me-101

[101](lab-aor)

; --- 102 ---
[102](lab-endpoint)
auth=102
aors=102
callerid="Lab 102" <102>

[102](lab-auth)
username=102
password=change-me-102

[102](lab-aor)

; --- 103 ---
[103](lab-endpoint)
auth=103
aors=103
callerid="Lab 103" <103>

[103](lab-auth)
username=103
password=change-me-103

[103](lab-aor)
