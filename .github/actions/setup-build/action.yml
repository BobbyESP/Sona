name: Set up the build
description: JDK and Gradle, with the Gradle cache. Run after actions/checkout.

inputs:
  cache-read-only:
    description: Whether this run may only read the Gradle cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # No Android SDK step: the runner image ships the SDK with its licenses accepted, and the
    # Android Gradle Plugin downloads the platform and build tools the build asks for.
    - name: Set up JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '21'

    # Also checks that the Gradle wrapper jar is a genuine one.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
